name: MG4 UI preview (emulator)

# Builds an x86_64 debug APK and runs it in an Android 9 emulator (the head unit
# runs Android 9) at the head unit's usable screen size. Screenshots are
# uploaded as an artifact and published to the preview-shots branch.

on:
  workflow_dispatch:
    inputs:
      screen_size:
        description: "Emulated screen size (WxH)"
        default: "1744x640"
      screen_density:
        description: "Emulated screen density (dpi)"
        default: "240"

permissions:
  contents: write # publish screenshots to the preview-shots branch

concurrency:
  group: mg4-emulator-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build x86_64 debug APK
        run: ./gradlew --console=plain assembleIzzyDebug --warning-mode summary
        env:
          METROLIST_ABIS: x86_64
          METROLIST_APPLICATION_ID: com.metrolist.music.mg4
          METROLIST_APP_NAME: Metrolist MG4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run in emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SCREEN_SIZE: ${{ inputs.screen_size || '1744x640' }}
          SCREEN_DENSITY: ${{ inputs.screen_density || '240' }}
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-preview.sh "$(ls app/build/outputs/apk/izzy/debug/*.apk | head -1)" preview-out

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mg4-ui-preview
          path: preview-out/
          retention-days: 14
          if-no-files-found: warn

      - name: Publish screenshots to branch preview-shots
        if: always()
        run: |
          set -e
          d="$(mktemp -d)"
          cp -r preview-out/. "$d/"
          cd "$d"
          git init -q
          git checkout -q -b preview-shots
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Preview screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" preview-shots
